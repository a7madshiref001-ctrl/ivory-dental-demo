<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Waiting Screen · Ivory Dental</title>
<meta name="theme-color" content="#F7F5F2">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Readex+Pro:wght@300;400;500;600&display=swap" rel="stylesheet">
<meta property="og:title" content="Ivory Dental · Waiting screen">
<meta property="og:description" content="شاشة الانتظار: الدور ونصايح للأسنان (Demo).">
<meta property="og:image" content="https://a7madshiref001-ctrl.github.io/ivory-dental-demo/assets/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="assets/ivory.css?v=3">
<style>
.scr{min-height:100dvh;display:grid}
@media (min-width:860px){.scr{grid-template-columns:1.15fr .85fr}}
.now{padding:28px clamp(20px,4vw,56px);display:flex;flex-direction:column;gap:8px}
.now header{display:flex;justify-content:space-between;align-items:center;margin-bottom:auto}
.clock{font-family:var(--f-en);font-size:34px;direction:ltr}
.big{font-family:var(--f-en);font-size:clamp(130px,24vw,320px);line-height:.85;direction:ltr;text-align:right;color:var(--teal);margin-top:28px}
.big.call{animation:call 1.2s var(--ease)}
@keyframes call{0%{transform:scale(.8);opacity:0}40%{transform:scale(1.05);opacity:1}100%{transform:none}}
.who{font-size:clamp(20px,2.6vw,30px);font-weight:500}
.who span{color:var(--muted);font-weight:400}
.next{margin-top:auto;padding-top:32px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.next .tk{height:48px;padding:0 18px;border-radius:999px;background:var(--card);border:1px solid var(--line);display:inline-flex;align-items:center;font-family:var(--f-en);font-size:26px;direction:ltr}
.tip{background:var(--teal-50);padding:28px clamp(20px,4vw,56px);display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;align-items:center}
.anim{width:min(300px,70vw);height:auto;overflow:visible}
.anim .tooth{fill:#fff;stroke:var(--teal);stroke-width:.45;stroke-linejoin:round}
.anim .face{fill:none;stroke:var(--ink);stroke-width:.5;stroke-linecap:round}
.anim .eye{fill:var(--ink)}
.anim .brush{animation:scrub 1.1s ease-in-out infinite;transform-box:view-box;transform-origin:150px 40px}
.anim .foam circle{fill:#fff;stroke:var(--teal-100);stroke-width:1;animation:foam 2.2s ease-out infinite;transform-box:fill-box;transform-origin:center}
.anim .foam circle:nth-child(2){animation-delay:.5s}
.anim .foam circle:nth-child(3){animation-delay:1s}
.anim .foam circle:nth-child(4){animation-delay:1.5s}
.anim .spk{fill:var(--teal);animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.anim .spk:nth-of-type(2){animation-delay:1.2s}
.anim .blink{animation:blinkEye 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes scrub{0%,100%{transform:translateX(-26px) rotate(-6deg)}50%{transform:translateX(26px) rotate(4deg)}}
@keyframes foam{0%{transform:translateY(0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
@keyframes twinkle{0%,100%{transform:scale(0);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes blinkEye{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
.tip-text{font-size:clamp(22px,2.6vw,34px);font-weight:500;line-height:1.45;max-width:18ch;min-height:2.9em;transition:opacity .5s,transform .5s var(--ease)}
.tip-text.out{opacity:0;transform:translateY(10px)}
.tdots{display:flex;gap:6px}
.tdots i{width:7px;height:7px;border-radius:7px;background:var(--teal-100);transition:width .4s var(--ease),background-color .4s}
.tdots i.on{width:22px;background:var(--teal)}
.back{position:fixed;bottom:14px;left:14px;opacity:.5}
.back:hover{opacity:1}
</style>
</head>
<body>
<main class="scr">
  <section class="now" aria-live="assertive">
    <header>
      <span class="brand"><span data-mark></span><span class="stack"><span class="name">Ivory</span><span class="label">Dental</span></span></span>
      <span class="clock" id="clock"></span>
    </header>
    <span class="label">Now serving</span>
    <div class="big" id="big">A-12</div>
    <div class="who" id="who"></div>
    <div class="next"><span class="label">Next</span><span id="next" style="display:flex;gap:8px;flex-wrap:wrap"></span></div>
  </section>

  <section class="tip">
    <svg class="anim" viewBox="0 0 200 190" aria-hidden="true">
      <g class="foam"><circle cx="78" cy="44" r="5"/><circle cx="118" cy="40" r="4"/><circle cx="96" cy="36" r="6"/><circle cx="132" cy="48" r="3.5"/></g>
      <g transform="translate(28 34) scale(6)">
        <path class="tooth" d="M7 3c-2.5 0-4 2-4 4.6 0 2.2.8 3.6 1.4 5.4.6 1.9.8 4.2 1.4 6.3.4 1.3 1 2.2 1.9 2.2 1.1 0 1.5-1.2 1.8-2.6.3-1.6.6-3.6 2.5-3.6s2.2 2 2.5 3.6c.3 1.4.7 2.6 1.8 2.6.9 0 1.5-.9 1.9-2.2.6-2.1.8-4.4 1.4-6.3.6-1.8 1.4-3.2 1.4-5.4C21 5 19.5 3 17 3c-2 0-3 1-5 1S9 3 7 3z"/>
        <ellipse class="eye blink" cx="9.6" cy="8.4" rx=".75" ry=".9"/>
        <ellipse class="eye blink" cx="14.4" cy="8.4" rx=".75" ry=".9"/>
        <path class="face" d="M10.2 10.6c1 .9 2.6.9 3.6 0"/>
      </g>
      <g class="brush">
        <rect x="104" y="18" width="92" height="9" rx="4.5" fill="var(--teal)"/>
        <rect x="70" y="16" width="38" height="13" rx="5" fill="#fff" stroke="var(--teal)" stroke-width="2"/>
        <g stroke="var(--teal-100)" stroke-width="3" stroke-linecap="round"><path d="M76 31v8M84 31v8M92 31v8M100 31v8"/></g>
      </g>
      <path class="spk" d="M36 60c.6 4.2 2.8 6.4 7 7-4.2.6-6.4 2.8-7 7-.6-4.2-2.8-6.4-7-7 4.2-.6 6.4-2.8 7-7z"/>
      <path class="spk" d="M168 92c.5 3.4 2.2 5.1 5.6 5.6-3.4.5-5.1 2.2-5.6 5.6-.5-3.4-2.2-5.1-5.6-5.6 3.4-.5 5.1-2.2 5.6-5.6z"/>
    </svg>
    <span class="label">Tip</span>
    <p class="tip-text" id="tip"></p>
    <div class="tdots" id="tdots"></div>
  </section>
</main>
<a class="sys back" href="index.html"><i data-i="grid"></i>System</a>

<script src="assets/ivory.js?v=3"></script>
<script>
(function () {
  const { desk, queueFrom } = IV;
  const $ = (s) => document.querySelector(s);

  let last = null;
  function render() {
    const q = queueFrom(desk.get());
    const big = $('#big');
    big.textContent = q.now ? 'A-' + q.now : '—';
    if (last !== null && last !== q.now) { big.classList.remove('call'); void big.offsetWidth; big.classList.add('call'); }
    last = q.now;
    $('#who').innerHTML = q.now ? `${q.nowName} <span>· أوضة 1</span>` : '<span>استنى شوية</span>';
    $('#next').innerHTML = q.waiting.slice(0, 4).map((w) => `<span class="tk">A-${w.n}</span>`).join('') || '<span class="muted">—</span>';
  }
  render();
  desk.on(render);

  const TIPS = [
    'اغسل سنانك مرتين في اليوم، دقيقتين كل مرة.',
    'غيّر الفرشة كل 3 شهور.',
    'الخيط بيوصل للي الفرشة مبتوصلوش.',
    'قلّل السكريات بين الوجبات.',
    'اكشف كل 6 شهور، حتى لو مفيش ألم.',
  ];
  let t = 0;
  const tip = $('#tip');
  $('#tdots').innerHTML = TIPS.map(() => '<i></i>').join('');
  function showTip() {
    tip.classList.add('out');
    setTimeout(() => {
      tip.textContent = TIPS[t];
      tip.classList.remove('out');
      document.querySelectorAll('#tdots i').forEach((d, i) => d.classList.toggle('on', i === t));
      t = (t + 1) % TIPS.length;
    }, 450);
  }
  showTip();
  setInterval(showTip, 7000);

  const clk = () => { $('#clock').textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }); };
  clk();
  setInterval(clk, 15000);
})();
</script>
</body>
</html>
